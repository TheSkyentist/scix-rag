[workspace]
name = "arxivrag"
version = "0.1.0"
description = "Local astronomical paper RAG pipeline (ADS/SciX corpus, self-hosted embedding + retrieval)"
channels = ["conda-forge"]
platforms = [{platform = "osx-arm64", macos = "14.5"}]

[dependencies]
python = ">=3.14.8,<3.15"
python-dotenv = ">=1.2.4,<2"

# DuckDB 2.0 (Oct 2026) is not on conda-forge yet (latest there: 1.5.6), so it comes from PyPI.
# Move it back to [dependencies] once the conda-forge feedstock catches up.
[pypi-dependencies]
duckdb = ">=2.0.0,<3"

[feature.query.dependencies]
httpx = ">=0.28.1,<0.29"

[feature.query.tasks]
query = "python -m src.ads_query"
query-lrd = "python -m src.ads_query --query 'abs:\"Little Red Dot\"'"
canonicalize = "python -m src.canonicalize"

[feature.fetch.dependencies]
httpx = ">=0.28.1,<0.29"
beautifulsoup4 = ">=4.15.0,<5"
lxml = ">=6.1.3,<7"

[feature.fetch.tasks]
fetch = "python -m src.fetch"

[feature.convert.dependencies]
beautifulsoup4 = ">=4.15.0,<5"
lxml = ">=6.1.3,<7"

[feature.convert.pypi-dependencies]
mineru = { version = ">=4.0.10, <5", extras = ["torch"] }
opencv-python-headless = ">=5.0.0.93, <6"

[feature.convert.tasks]
convert = "python -m src.convert"

[feature.chunk.dependencies]
transformers = ">=5.20.2,<6"

[feature.chunk.tasks]
chunk = "python -m src.chunk"

[feature.embed.dependencies]
mlx = ">=0.32.4,<0.33"
mlx-lm = ">=0.32.2,<0.33"

[feature.embed.tasks]
embed = "python -m src.embed"
search = "python -m src.search"

[feature.browse.tasks]
browse = "marimo edit notebooks/browse.py"

[feature.browse.dependencies]
marimo = ">=0.25.1,<0.26"
polars = ">=2.0.0,<3"
pyarrow = ">=25.0.0,<26"

# Grow/refresh the corpus end to end: re-run the Little Red Dots seed query (`query-lrd`; cheap, only
# bibcodes not already in the DB are fetched), then every stage in order. Each stage lives in its own
# environment and pixi picks the one that defines the task. Re-running is safe: every stage resumes.
[tasks]
all = { description = "query-lrd -> fetch -> convert -> chunk -> embed", depends-on = ["query-lrd", "fetch", "convert", "chunk", "embed"] }

[environments]
query = { features = ["query"] }
fetch = { features = ["fetch"] }
convert = { features = ["convert"] }
chunk = { features = ["chunk"] }
embed = { features = ["embed"] }
browse = { features = ["browse"] }
