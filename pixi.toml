[workspace]
name = "arxivrag"
version = "0.1.0"
description = "Astronomical paper RAG pipeline using ADS/SciX and GWDG Arcana"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.14.4,<3.15"
polars = ">=1.40.1,<2"
duckdb = ">=1.5.2,<2"
marimo = ">=0.23.5,<0.24"
beautifulsoup4 = ">=4.14.3,<5"
lxml = ">=6.1.0,<7"
httpx = ">=0.28.1,<0.29"
python-dotenv = ">=1.2.2,<2"
tiktoken = ">=0.12.0,<0.13"

[tasks]
query = "python -m src.ads_query"
fetch-convert = "python -m src.fetch_convert"
arcana-upload = "python -m src.arcana_upload"
