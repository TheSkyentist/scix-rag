name: Weekly LRD corpus update

# "Sunday night" to let ADS catch up on the week's arXiv submissions.
# Cron is UTC -- 23:00 UTC Sunday. Adjust to match your actual timezone.
on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch: {}

concurrency:
  group: weekly-ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Pull new citing papers (citations only; DB dedup handles novelty, no date filter needed)
        env:
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
        run: pixi run query --query 'abs:"Little Red Dots"' --no-references

      - name: Fetch + convert whatever's newly pending
        env:
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
        run: pixi run fetch-convert

      - name: Upload new files to Arcana
        # Deliberately not calling generate-index here -- its actual cost
        # behavior on repeat calls is still an open question with GWDG.
        # Trigger indexing as a separate, manual (or less-frequent) step
        # until that's confirmed, so a scheduled run can't unexpectedly
        # balloon in runtime as the corpus grows.
        env:
          SAIA_API_KEY: ${{ secrets.SAIA_API_KEY }}
          ARCANA_NAME: ${{ secrets.ARCANA_NAME }}
        run: pixi run arcana-upload --all --no-index

      - name: Commit updated papers.duckdb
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/papers.duckdb
          git diff --cached --quiet || git commit -m "Weekly corpus update: $(date -u +%Y-%m-%d)"
          git push
